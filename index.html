<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>座位抽签</title>
    <style>
        /* ========== 暗色简洁主题 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #121212;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 18px 16px 20px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 14px;
        }
        .btn {
            background: #2a2a2a;
            border: none;
            color: #ddd;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #444;
        }
        .btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #666;
        }
        .btn-primary {
            background: #3a6b5c;
            border-color: #4a8a77;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4a8a77;
        }
        .btn-reset {
            background: #3a2a2a;
            border-color: #5a3a3a;
            color: #ccc;
        }
        .btn-reset:hover {
            background: #5a3a3a;
        }

        .classroom {
            background: #252525;
            border-radius: 16px;
            padding: 12px 10px 8px;
            border: 1px solid #3a3a3a;
        }
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
            margin-bottom: 6px;
        }

        .teacher-row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 3px;
            margin-top: 2px;
        }
        .teacher-cell {
            grid-column: 1 / 3;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 6px 0;
            text-align: center;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            border: 1px solid #444;
        }
        .teacher-row .empty-cell {
            background: transparent;
            border: none;
        }

        .seat {
            aspect-ratio: 1 / 1.05;
            background: #2a2a2a;
            border-radius: 6px;
            border: 1px solid #3d3d3d;
            min-height: 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .seat.aisle {
            background: transparent !important;
            border: none !important;
        }
        .seat .number {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
            opacity: 0;
            transform: translateY(50px);
            display: block;
            line-height: 1;
        }
        .seat.fixed .number {
            opacity: 1 !important;
            transform: translateY(0) !important;
            color: #e0e0e0;
        }
        .seat.empty .number {
            display: none;
        }

        /* ===== 手机端缩小 ===== */
        @media (max-width: 780px) {
            .container { padding: 14px 12px 16px; }
            .seat { min-height: 32px; }
            .seat .number { font-size: 11px; }
            .btn { font-size: 13px; padding: 5px 14px; }
            .teacher-cell { font-size: 12px; padding: 4px 0; }
            .seat-grid { gap: 2px; }
            .teacher-row { gap: 2px; }
            .classroom { padding: 8px 6px 6px; }
        }
        @media (max-width: 550px) {
            .container { padding: 10px 8px 12px; border-radius: 16px; }
            .seat { min-height: 26px; border-radius: 4px; }
            .seat .number { font-size: 10px; }
            .btn { font-size: 12px; padding: 4px 12px; }
            .teacher-cell { font-size: 11px; padding: 3px 0; }
            .seat-grid { gap: 2px; }
            .teacher-row { gap: 2px; }
            .header { gap: 6px; margin-bottom: 10px; }
            .classroom { padding: 6px 4px 4px; border-radius: 12px; }
        }
        @media (max-width: 400px) {
            .seat { min-height: 20px; }
            .seat .number { font-size: 8px; }
            .teacher-cell { font-size: 9px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="btn btn-primary" id="btnShuffle">开始排座</button>
        <button class="btn btn-reset" id="btnReset">重置</button>
    </div>

    <div class="classroom">
        <div class="seat-grid" id="seatGrid"></div>
        <div class="teacher-row">
            <div class="teacher-cell">老师座位</div>
            <div class="empty-cell" style="grid-column: 3 / 13;"></div>
        </div>
    </div>
</div>

<script>
    // ===================== 配置 =====================
    const TOTAL = 51;
    const FIXED = {
        13: { row: 5, col: 5 },
        17: { row: 5, col: 0 }
    };
    // A组已加入40和48
    const GROUPS = [
        { students: [39, 38, 28, 31, 40, 48], label: 'A' },
        { students: [23, 41, 20, 35], label: 'B' },
        { students: [34, 24, 7, 1], label: 'C' }
    ];

    const ROWS = 6, COLS = 12;
    const SEAT_MAP = Array.from({ length: ROWS }, (_, r) =>
        Array.from({ length: COLS }, (_, c) => {
            if (c === 2 || c === 6 || c === 9) return false;
            if (r === 0 && (c === 3 || c === 4 || c === 5)) return false;
            return true;
        })
    );

    // ===================== 状态 =====================
    let seats = [];
    let isAnimating = false;
    const gridEl = document.getElementById('seatGrid');
    const btnShuffle = document.getElementById('btnShuffle');
    const btnReset = document.getElementById('btnReset');

    // ===================== 工具 =====================
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function getSeatIndex(row, col) { return row * COLS + col; }
    function getGridSeats(gridRow, gridCol) {
        const coords = [];
        for (let dr = 0; dr < 3; dr++) {
            for (let dc = 0; dc < 3; dc++) {
                const r = gridRow + dr, c = gridCol + dc;
                if (r < ROWS && c < COLS && SEAT_MAP[r][c]) coords.push({ row: r, col: c });
            }
        }
        return coords;
    }
    function containsFixed(gridRow, gridCol) {
        const seats = getGridSeats(gridRow, gridCol);
        for (const pos of seats) {
            for (const [id, fixed] of Object.entries(FIXED)) {
                if (pos.row === fixed.row && pos.col === fixed.col) return true;
            }
        }
        return false;
    }
    function gridsOverlap(g1, g2) {
        const s1 = getGridSeats(g1.row, g1.col);
        const s2 = getGridSeats(g2.row, g2.col);
        for (const a of s1) for (const b of s2) {
            if (a.row === b.row && a.col === b.col) return true;
        }
        return false;
    }
    function pickRandomGrid(existing, maxAttempts = 300) {
        for (let i = 0; i < maxAttempts; i++) {
            const r = Math.floor(Math.random() * (ROWS - 2));
            const c = Math.floor(Math.random() * (COLS - 2));
            if (containsFixed(r, c)) continue;
            if (getGridSeats(r, c).length < 4) continue;
            const candidate = { row: r, col: c };
            let ok = true;
            for (const ex of existing) if (gridsOverlap(candidate, ex)) { ok = false; break; }
            if (ok) return candidate;
        }
        for (let r = 0; r < ROWS - 2; r++) for (let c = 0; c < COLS - 2; c++) {
            if (!containsFixed(r, c) && getGridSeats(r, c).length >= 4) {
                let ok = true;
                for (const ex of existing) if (gridsOverlap({ row: r, col: c }, ex)) { ok = false; break; }
                if (ok) return { row: r, col: c };
            }
        }
        return { row: 0, col: 0 };
    }

    // ===================== 核心排座 =====================
    function arrangeSeats() {
        seats = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                seats.push({
                    row: r, col: c,
                    studentId: null,
                    isSeat: SEAT_MAP[r][c],
                    fixed: false,
                    group: null,
                });
            }
        }
        for (const [id, pos] of Object.entries(FIXED)) {
            const idx = getSeatIndex(pos.row, pos.col);
            if (seats[idx].isSeat) {
                seats[idx].studentId = parseInt(id);
                seats[idx].fixed = true;
            }
        }
        const available = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
            const idx = getSeatIndex(r, c);
            if (seats[idx].isSeat && !seats[idx].fixed) available.push({ row: r, col: c });
        }
        shuffle(available);
        const students = [];
        for (let i = 1; i <= TOTAL; i++) if (!FIXED[i]) students.push(i);
        shuffle(students);
        for (let i = 0; i < available.length; i++) {
            const pos = available[i];
            const idx = getSeatIndex(pos.row, pos.col);
            if (i < students.length) seats[idx].studentId = students[i];
            else seats[idx].studentId = null;
        }

        // 九宫格交换
        const gridPositions = [];
        for (const g of GROUPS) {
            const grid = pickRandomGrid(gridPositions);
            gridPositions.push(grid);
            const gridSeats = getGridSeats(grid.row, grid.col);
            const shuffledGridSeats = shuffle([...gridSeats]);
            const targetSeats = shuffledGridSeats.slice(0, g.students.length);
            const groupStudents = g.students;
            const originSeats = [];
            for (const sid of groupStudents) {
                let found = null;
                for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                    const idx = getSeatIndex(r, c);
                    if (seats[idx].studentId === sid) { found = { row: r, col: c }; break; }
                }
                if (found) originSeats.push(found);
            }
            for (let i = 0; i < groupStudents.length; i++) {
                const origin = originSeats[i];
                const target = targetSeats[i];
                if (!origin || !target) continue;
                const originIdx = getSeatIndex(origin.row, origin.col);
                const targetIdx = getSeatIndex(target.row, target.col);
                const temp = seats[targetIdx].studentId;
                seats[targetIdx].studentId = seats[originIdx].studentId;
                seats[originIdx].studentId = temp;
                seats[targetIdx].group = g.label;
                seats[originIdx].group = null;
            }
        }

        renderWithAnimation();
    }

    // ===================== 渲染 + 慢滑绕圈 =====================
    function renderWithAnimation() {
        gridEl.innerHTML = '';
        const animItems = [];

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const idx = getSeatIndex(r, c);
                const data = seats[idx];
                const div = document.createElement('div');
                div.className = 'seat';
                if (!data.isSeat) {
                    div.classList.add('aisle');
                    gridEl.appendChild(div);
                    continue;
                }

                const span = document.createElement('span');
                span.className = 'number';
                if (data.fixed) {
                    span.textContent = data.studentId;
                    span.style.opacity = '1';
                    span.style.transform = 'translateY(0)';
                    div.classList.add('fixed');
                } else if (data.studentId !== null) {
                    span.textContent = '';
                    span.dataset.studentId = data.studentId;
                    span.style.opacity = '0';
                    span.style.transform = 'translateY(50px)';
                    animItems.push({ div, span, studentId: data.studentId });
                } else {
                    span.textContent = '';
                    span.style.opacity = '0';
                    div.classList.add('empty');
                }
                div.appendChild(span);
                gridEl.appendChild(div);
            }
        }

        shuffle(animItems);

        let delay = 0;
        const step = 250;
        const duration = 2800;

        for (const item of animItems) {
            const sid = item.studentId;
            const span = item.span;
            span.textContent = sid;

            const rand = (min, max) => Math.random() * (max - min) + min;
            const pts = [];
            for (let i = 0; i < 3; i++) {
                pts.push({
                    tx: rand(-80, 80),
                    ty: rand(-60, 60),
                    rot: rand(-25, 25)
                });
            }
            const keyframes = [
                { transform: 'translateY(50px) translateX(0) rotate(0deg)', opacity: 0 },
                { transform: `translateY(${pts[0].ty}px) translateX(${pts[0].tx}px) rotate(${pts[0].rot}deg)`, opacity: 1 },
                { transform: `translateY(${pts[1].ty}px) translateX(${pts[1].tx}px) rotate(${pts[1].rot}deg)`, opacity: 1 },
                { transform: `translateY(${pts[2].ty}px) translateX(${pts[2].tx}px) rotate(${pts[2].rot}deg)`, opacity: 1 },
                { transform: 'translateY(0) translateX(0) rotate(0deg)', opacity: 1 }
            ];
            const options = {
                duration: duration,
                delay: delay,
                easing: 'ease-in-out',
                fill: 'forwards'
            };
            const anim = span.animate(keyframes, options);
            anim.onfinish = () => {
                span.style.opacity = '1';
                span.style.transform = 'translateY(0)';
                span.style.animation = 'none';
            };

            delay += step;
        }
    }

    // ===================== 重置 =====================
    function resetSeats() {
        gridEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const isSeat = SEAT_MAP[r][c];
                const div = document.createElement('div');
                div.className = 'seat';
                if (!isSeat) {
                    div.classList.add('aisle');
                    gridEl.appendChild(div);
                    continue;
                }
                const span = document.createElement('span');
                span.className = 'number';
                let fixedId = null;
                for (const [id, pos] of Object.entries(FIXED)) {
                    if (pos.row === r && pos.col === c) fixedId = parseInt(id);
                }
                if (fixedId !== null) {
                    span.textContent = fixedId;
                    span.style.opacity = '1';
                    span.style.transform = 'translateY(0)';
                    div.classList.add('fixed');
                } else {
                    span.textContent = '';
                    span.style.opacity = '0';
                    span.style.transform = 'translateY(50px)';
                }
                div.appendChild(span);
                gridEl.appendChild(div);
            }
        }
        seats = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
            seats.push({ row: r, col: c, studentId: null, isSeat: SEAT_MAP[r][c], fixed: false, group: null });
        }
        for (const [id, pos] of Object.entries(FIXED)) {
            const idx = getSeatIndex(pos.row, pos.col);
            if (seats[idx].isSeat) { seats[idx].studentId = parseInt(id); seats[idx].fixed = true; }
        }
    }

    // ===================== 事件 =====================
    btnShuffle.addEventListener('click', () => {
        if (isAnimating) return;
        isAnimating = true;
        resetSeats();
        setTimeout(() => {
            arrangeSeats();
            setTimeout(() => { isAnimating = false; }, 5500);
        }, 300);
    });

    btnReset.addEventListener('click', () => {
        if (isAnimating) return;
        resetSeats();
    });

    // ===================== 启动 =====================
    resetSeats();
    console.log('✅ 已调整手机端尺寸');
</script>
</body>
</html>
