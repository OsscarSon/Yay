<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班级自动排座系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0d14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
    }

    .btn-container {
      margin-bottom: 24px;
    }

    .start-btn {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      transition: all 0.2s ease;
    }

    .start-btn:hover { background-color: #16a34a; transform: scale(1.03); }
    .start-btn:disabled { background-color: #4b5563; cursor: not-allowed; opacity: 0.7; }

    .classroom-card {
      background-color: #121622;
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 28px 20px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      overflow-x: auto;
    }

    .seating-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      min-height: 280px;
    }

    .group {
      display: grid;
      gap: 10px;
    }

    .group-2col { grid-template-columns: repeat(2, 1fr); }
    .group-3col { grid-template-columns: repeat(3, 1fr); }

    .seat {
      width: 40px;
      height: 40px;
      background-color: #ffffff;
      color: #111111;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      user-select: none;
    }

    .teacher-desk {
      background-color: #53332a;
      color: #d19a86;
      font-size: 12px;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 6px;
      width: fit-content;
      margin-top: 24px;
      border: 1px solid #6e4236;
    }
  </style>
</head>
<body>

  <div class="btn-container">
    <button class="start-btn" id="startBtn" onclick="startShuffle()">开始排座</button>
  </div>

  <div class="classroom-card">
    <div class="seating-grid">
      <div class="group group-2col" id="g1"></div>
      <div class="group group-3col" id="g2"></div>
      <div class="group group-2col" id="g3"></div>
      <div class="group group-2col" id="g4"></div>
    </div>
    <div class="teacher-desk">老师座位</div>
  </div>

  <script>
    const TOTAL_SEATS = 51; 
    const GROUP_SIZES = [12, 18, 12, 9]; 

    // 1. 死锁固定座位 (位置索引 : 座号)
    const FIXED_LOCKS = {
      10: 17, // 第一组最左下角固定 17 号
      29: 13  // 第二组最右下角固定 13 号
    };

    // 2. 3x3 九宫格绑定的 4 人组 (学号)
    const VIP_NUMBERS = [39, 38, 28, 31]; 

    // 3x3 九宫格物理座位索引
    const AREA_3X3_POSITIONS = [3, 15, 16, 5, 18, 19, 7, 21, 22]; 

    function getOriginalSeats() {
      const arr = [];
      for (let i = 1; i <= TOTAL_SEATS; i++) {
        arr.push(i);
      }
      return arr;
    }

    function shuffle(array) {
      const arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
      }
      return arr;
    }

    function generateRiggedSeats(baseSeats) {
      const fixedNums = [];
      for (const key in FIXED_LOCKS) {
        fixedNums.push(FIXED_LOCKS[key]);
      }

      const normalSeats = baseSeats.filter(function(num) {
        return VIP_NUMBERS.indexOf(num) === -1 && fixedNums.indexOf(num) === -1;
      });

      const shuffledNormal = shuffle(normalSeats);
      const shuffledVip = shuffle(VIP_NUMBERS);
      const finalSeats = new Array(TOTAL_SEATS);

      // 第一步：写入死锁座位
      for (const posIndex in FIXED_LOCKS) {
        finalSeats[Number(posIndex)] = FIXED_LOCKS[posIndex];
      }

      // 第二步：九宫格放置 VIP
      const shuffledArea = shuffle(AREA_3X3_POSITIONS);
      for (let i = 0; i < VIP_NUMBERS.length; i++) {
        const posIndex = shuffledArea[i];
        finalSeats[posIndex] = shuffledVip[i];
      }

      // 第三步：填充普通号码
      let normalIdx = 0;
      for (let i = 0; i < TOTAL_SEATS; i++) {
        if (finalSeats[i] === undefined) {
          finalSeats[i] = shuffledNormal[normalIdx++];
        }
      }
      return finalSeats;
    }

    function renderSeats(seatList) {
      for (let groupIdx = 0; groupIdx < GROUP_SIZES.length; groupIdx++) {
        const groupEl = document.getElementById('g' + (groupIdx + 1));
        if (groupEl) groupEl.innerHTML = '';
      }

      let currentIndex = 0;
      for (let groupIdx = 0; groupIdx < GROUP_SIZES.length; groupIdx++) {
        const size = GROUP_SIZES[groupIdx];
        const groupEl = document.getElementById('g' + (groupIdx + 1));
        if (!groupEl) continue;

        for (let i = 0; i < size; i++) {
          if (currentIndex < seatList.length) {
            const seatDiv = document.createElement('div');
            seatDiv.className = 'seat';
            seatDiv.textContent = seatList[currentIndex];
            groupEl.appendChild(seatDiv);
            currentIndex++;
          }
        }
      }
    }

    function startShuffle() {
      const btn = document.getElementById('startBtn');
      if (btn) btn.disabled = true;
      let count = 0;
      const baseSeats = getOriginalSeats();

      const timer = setInterval(function() {
        renderSeats(shuffle(baseSeats));
        count++;
        if (count > 25) { 
          clearInterval(timer);
          renderSeats(generateRiggedSeats(baseSeats));
          if (btn) btn.disabled = false;
        }
      }, 40);
    }

    // 确保网页准备完毕后立即渲染
    function init() {
      renderSeats(getOriginalSeats());
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
